<!doctype html>
<html lang="zh-CN">
<head>

  <title>Y FIT 营养搭配工具</title>
  <style>

    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}.app{width:min(1280px,100%);margin:0 auto;padding:16px}.hero{min-height:250px;position:relative;overflow:hidden;border-radius:8px;background:#d8e1d8;color:#fff}.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(13,37,24,.84),rgba(13,37,24,.48) 45%,rgba(13,37,24,.04))}.hero-copy{position:relative;z-index:1;max-width:590px;padding:28px}.brand{display:flex;align-items:center;gap:10px}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:7px;background:#fff;color:var(--green);font-weight:900}.hero h1{font-size:32px;margin:18px 0 8px;letter-spacing:0}.hero p{margin:0;line-height:1.6}.layout{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px;margin-top:16px;align-items:start}.panel{background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(24,44,32,.05)}.side{position:sticky;top:12px}.section{padding:16px}.section+.section{border-top:1px solid var(--line)}h2,h3{margin:0}h2{font-size:19px}h3{font-size:15px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.grid{display:grid;gap:11px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}label{display:grid;gap:6px;color:var(--muted);font-size:12px;font-weight:800}input,select{width:100%;min-width:0;min-height:38px;border:1px solid #c7d4c8;border-radius:6px;padding:8px;background:#fff;color:var(--ink);outline:none}input:focus,select:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(25,114,70,.13)}.btn{min-height:38px;border:1px solid #c6d2c7;border-radius:6px;padding:8px 11px;background:#fff;color:var(--ink);font-size:13px;font-weight:900}.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}.btn.full{width:100%}.actions{display:flex;gap:8px;flex-wrap:wrap}.tag{display:inline-flex;align-items:center;min-height:23px;padding:3px 8px;border-radius:5px;background:var(--green-soft);color:var(--green);font-size:12px;font-weight:900;white-space:nowrap}.muted,.tip{color:var(--muted);font-size:13px;line-height:1.55}.main{min-width:0;display:grid;gap:16px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.metric{padding:14px;border:1px solid var(--line);border-radius:7px;background:#fbfcfa}.metric span{display:block;color:var(--muted);font-size:12px;font-weight:800}.metric strong{display:block;margin-top:7px;font-size:28px;line-height:1.05}.macro-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.macro{padding:13px;border-left:3px solid var(--green);background:#f7fbf8}.macro:nth-child(2){border-color:var(--blue);background:var(--blue-soft)}.macro:nth-child(3){border-color:var(--amber);background:var(--amber-soft)}.macro strong{display:block;margin-top:6px;font-size:25px}.meals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.meal{border:1px solid var(--line);border-radius:7px;overflow:hidden}.meal-head{display:flex;justify-content:space-between;gap:8px;padding:10px;background:#eff6ef;font-weight:900}.meal-body{padding:10px}.meal-body ul{margin:9px 0 0;padding-left:20px;font-size:13px;line-height:1.75}.meal-body li span{color:var(--muted)}.notice{padding:10px 12px;border-radius:6px;background:#f6faf7;border:1px solid #d4e5d7;color:var(--muted);font-size:13px;line-height:1.55}.food-library{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.food-group{padding:12px;border:1px solid var(--line);border-radius:7px}.food-group h3{margin-bottom:8px}.food-list{display:grid;gap:5px}.food-row{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #edf1ec;padding-bottom:5px;font-size:12px}.food-row span:last-child{color:var(--muted);white-space:nowrap}.hidden{display:none!important}@media(max-width:1000px){.layout{grid-template-columns:1fr}.side{position:static}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.meals{grid-template-columns:1fr}}@media(max-width:650px){.app{padding:10px}.hero{min-height:240px}.hero-copy{padding:20px}.hero h1{font-size:28px}.two,.metrics,.macro-grid,.food-library{grid-template-columns:1fr}.actions .btn{flex:1}.section{padding:13px}}

</head>
<body>
  <main class="app">
    <section class="hero" aria-label="Y FIT 营养搭配工具">
      <img class="hero-img" src="meal-hero.png" alt="鸡胸肉、米饭、蔬菜和坚果组成的均衡餐盘">
      <div class="hero-copy"><div class="brand"><div class="mark">Y</div><strong>Y FIT</strong></div><h1>营养搭配工具</h1><p>输入身体数据，选择训练目标与食材，生成每日热量、营养分配和生重餐单。</p></div>
    </section>
    <div class="layout">
      <aside class="panel side">
        <section class="section"><div class="section-head"><h2>身体与目标</h2><span class="tag">本地计算</span></div>
          <div class="grid">
            <div class="two grid"><label>性别<select id="sex"><option value="male">男</option><option value="female">女</option></select></label><label>年龄<input id="age" type="number" min="14" max="85" value="30"></label></div>
            <div class="two grid"><label>身高 cm<input id="height" type="number" min="130" max="230" value="175"></label><label>体重 kg<input id="weight" type="number" min="35" max="220" step="0.1" value="75"></label></div>
            <label>目标<select id="goal"><option value="cut">减脂</option><option value="bulk">增肌</option></select></label>
            <div class="two grid"><label>目标体重 kg<input id="targetWeight" type="number" min="35" max="220" step="0.1" value="70"></label><label>计划周期 周<input id="weeks" type="number" min="2" max="52" value="12"></label></div>
            <div class="two grid"><label>每周训练<select id="trainingDays"><option value="3">3 次</option><option value="4" selected>4 次</option><option value="5">5 次</option></select></label><label>每日餐数<select id="mealCount"><option value="3">3 餐</option><option value="4" selected>4 餐</option><option value="5">5 餐</option></select></label></div>
          </div>
        </section>
        <section class="section"><div class="section-head"><h2>营养策略</h2><span class="tag">科学配比</span></div><div class="grid"><label>饮食热量搭配<select id="macroProfile"></select></label><div class="two grid"><label>碳水倍率<select id="carbMultiplier"></select></label><label>蛋白质倍率<select id="proteinMultiplier"></select></label></div><label>脂肪倍率<select id="fatMultiplier"></select></label></div></section>
        <section class="section"><div class="section-head"><h2>食材选择</h2><span class="tag">生重</span></div><div class="grid"><label>蛋白质<select id="proteinChoice"></select></label><label>碳水<select id="carbChoice"></select></label><label>脂肪<select id="fatChoice"></select></label><button id="generate" class="btn primary full">生成营养餐单</button><div class="actions"><button id="copy" class="btn" type="button">复制方案</button><button id="print" class="btn" type="button">打印 / PDF</button></div></div></section>
        <section class="section"><p class="tip">数据仅保存在当前浏览器本地。食材值为常用食材的估算值，重量均为烹饪前生重；本工具用于健康成人一般营养规划，不替代医生或营养师的个体化诊疗。</p></section>
      </aside>
      <section class="main">
        <section class="metrics" id="metrics"></section>
        <section class="panel section"><div class="section-head"><div><h2>每日营养分配</h2><p class="muted" id="summaryText"></p></div><span id="pace" class="tag"></span></div><div class="macro-grid" id="macros"></div><div class="notice" id="notes" style="margin-top:12px"></div></section>
        <section class="panel section"><div class="section-head"><div><h2>一日餐单</h2><p class="muted">根据所选食材自动搭配</p></div><span id="mealTag" class="tag"></span></div><div class="meals" id="meals"></div></section>
        <section class="panel section"><div class="section-head"><div><h2>常用食材热量库</h2><p class="muted">每 100g 可食生重的近似值</p></div></div><div class="food-library" id="foodLibrary"></div></section>
      </section>
    </div>
  </main>

    function calculate(){const d=input();if(!d.age||!d.height||!d.weight||!d.target||!d.weeks){alert('请完整填写身体数据和目标。');return}if(d.age<14||d.height<130||d.weight<35||d.weeks<2){alert('请检查输入范围。');return}const bmi=d.weight/((d.height/100)**2),bmr=10*d.weight+6.25*d.height-5*d.age+(d.sex==='male'?5:-161),train=5.5*3.5*d.weight/200*60*d.days/7,tdee=bmr*1.35+train,raw=Math.abs(d.target-d.weight)*(d.goal==='cut'?7700:4500)/(d.weeks*7),adjust=d.goal==='cut'?Math.min(Math.max(raw,300),750):Math.min(Math.max(raw,150),450),cal=Math.max(d.goal==='cut'?tdee-adjust:tdee+adjust,d.sex==='male'?1500:1200),p=d.weight*(d.goal==='cut'?2:1.8),f=Math.max(d.weight*(d.goal==='cut'?.8:.9),cal*.2/9);let c=(cal-p*4-f*9)/4;if(c<80)c=80;const ratios={3:[.3,.35,.35],4:[.25,.3,.15,.3],5:[.2,.12,.28,.15,.25]}[d.meals],names={3:['早餐','午餐','晚餐'],4:['早餐','午餐','加餐','晚餐'],5:['早餐','上午加餐','午餐','训练后加餐','晚餐']}[d.meals];const vegs=['西兰花','菠菜','番茄','黄瓜','胡萝卜'];const meals=ratios.map((ratio,i)=>{const protein=choose('protein',d.p,d.goal,i),carb=choose('carb',d.c,d.goal,i),fat=choose('fat',d.f,d.goal,i),veg=find(vegs[i%vegs.length]),target={p:p*ratio,c:c*ratio,f:f*ratio,k:cal*ratio};let total=nut(veg,d.goal==='cut'?180:150),items=[];const highFat=protein.f/Math.max(protein.p,1)>.8;if(highFat){const g=round5(Math.min(Math.max(target.f*.55/protein.f*100,30),130));items.push({food:protein,grams:g,role:'蛋白/脂肪来源'});total=add(total,nut(protein,g));const helper=find('鸡胸肉'),hg=round5(Math.max(target.p-total.p,8)/helper.p*100);items.push({food:helper,grams:hg,role:'补充瘦蛋白'});total=add(total,nut(helper,hg))}else{const g=round5(Math.max(target.p-total.p,8)/protein.p*100);items.push({food:protein,grams:g,role:'蛋白质'});total=add(total,nut(protein,g))}const cg=round5(Math.max(target.c-total.c,8)/carb.c*100);items.push({food:carb,grams:cg,role:'主食'});total=add(total,nut(carb,cg));const fg=target.f>total.f?round5((target.f-total.f)/fat.f*100):0;if(fg){items.push({food:fat,grams:fg,role:'脂肪'});total=add(total,nut(fat,fg))}items.     function calculate(){const d=input();if(!d.age||!d.height||!d.weight||!d.target||!d.weeks){alert('请完整填写身体数据和目标。');return}if(d.age<14||d.height<130||d.weight<35||d.weeks<2){alert('请检查输入范围。');return}const bmi=d.weight/((d.height/100)**2),bmr=10*d.weight+6.25*d.height-5*d.age+(d.sex==='male'?5:-161),train=5.5*3.5*d.weight/200*60*d.days/7,tdee=bmr*1.35+train,raw=Math.abs(d.target-d.weight)*(d.goal==='cut'?7700:4500)/(d.weeks*7),adjust=d.goal==='cut'?Math.min(Math.max(raw,300),750):Math.min(Math.max(raw,150),450),baseCal=Math.max(d.goal==='cut'?tdee-adjust:tdee+adjust,d.sex==='male'?1500:1200),profile=macroProfiles[d.profile]||macroProfiles.smart,cal=baseCal*profile.calorieScale,targets=getTargets(d,cal,profile),ratios={3:[.3,.35,.35],4:[.25,.3,.15,.3],5:[.2,.12,.28,.15,.25]}[d.meals],names={3:['早餐','午餐','晚餐'],4:['早餐','午餐','加餐','晚餐'],5:['早餐','上午加餐','午餐','训练后加餐','晚餐']}[d.meals];const meals=ratios.map((ratio,index)=>{const protein=choose('protein',d.p,d.goal,index),carb=choose('carb',d.c,d.goal,index),fat=choose('fat',d.f,d.goal,index),veg=selectVeg(protein,index),target={p:targets.p*ratio,c:targets.c*ratio,f:targets.f*ratio};let total=nut(veg,d.goal==='cut'?180:150);const items=[];const highFat=protein.f/Math.max(protein.p,1)>.8;if(highFat){const grams=round5(Math.min(Math.max(target.f*.55/protein.f*100,30),130));items.push({food:protein,grams,role:'蛋白/脂肪来源'});total=add(total,nut(protein,grams));const helper=find('鸡胸肉'),helperGrams=round5(Math.max(target.p-total.p,8)/helper.p*100);items.push({food:helper,grams:helperGrams,role:'补充瘦蛋白'});total=add(total,nut(helper,helperGrams))}else{const grams=round5(Math.max(target.p-total.p,8)/protein.p*100);items.push({food:protein,grams,role:'蛋白质'});total=add(total,nut(protein,grams))}const carbGrams=round5(Math.max(target.c-total.c,8)/carb.c*100);items.push({food:carb,grams:carbGrams,role:'主食'});total=add(total,nut(carb,carbGrams));const fatGrams=target.f>total.f?round5((target.f-total.f)/fat.f*100):0;if(fatGrams){items.push({foo
